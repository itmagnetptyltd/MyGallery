<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MyGallery</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}" />
  </head>
  <body>
    <header class="bar">
      <h1>MyGallery</h1>
      <div data-testid="upload-control">
        <button type="button" class="upload" data-testid="upload-open">
          Upload photos
        </button>
      </div>
      <span class="count" data-testid="photo-count">0</span>
    </header>

    <main>
      <!-- REQ-GAL-007: an empty Gallery says so. An unreadable one reports an
           error instead — the two must not look the same. -->
      <p class="empty" data-testid="empty-gallery" hidden>
        No photos yet. Click Upload to add your first photos.
      </p>

      <p class="error" data-testid="gallery-error" hidden>
        The Gallery could not be read.
      </p>

      <ul class="upload-failures" data-testid="upload-failures" hidden></ul>

      <section class="gallery" data-testid="gallery" aria-label="Gallery"></section>

      <!-- Watched by the page to load more as the user scrolls. REQ-GAL-003
           asks for no numbered page control, so there is none. -->
      <div class="sentinel" data-testid="scroll-sentinel"></div>
    </main>

    <!-- REQ-GAL-004: the Larger view sits over the Gallery. A native <dialog>
         opened with showModal() gives Escape-to-close, a focus trap and a
         backdrop without any of it being written here, and because it does not
         navigate, the Gallery keeps its scroll position underneath. -->
    <dialog class="upload-popup" data-testid="upload-popup" aria-label="Upload">
      <!-- REQ-GAL-013@v2 c3/c4: the client asked for a cross at the top right
           so the popup can be dismissed without uploading anything. Escape
           already did that, but an invisible control is not a control. -->
      <button
        type="button"
        class="upload-popup-close"
        data-testid="upload-popup-close"
        aria-label="Close"
      >
        &times;
      </button>
      <p>Choose photos to add to the Gallery.</p>
      <label class="upload-pick">
        <span class="outline-button">Choose files</span>
        <input
          type="file"
          accept="image/jpeg,image/png,image/gif,image/webp"
          multiple
          data-testid="upload-input"
        />
      </label>

      <!-- REQ-GAL-001@v3 c15/c16: what was chosen is shown before the Upload
           is made, one preview per file including a batch of thirty. -->
      <ul class="upload-previews" data-testid="upload-previews" hidden></ul>

      <!-- REQ-GAL-001@v3 c12/c13. maxlength is the criterion: the field holds
           250 and the Upload is never refused for being longer. -->
      <label class="upload-description-label">
        <span>Description (optional)</span>
        <!-- REQ-GAL-017 c4/c5: the client asked for "a count on ke prass".
             It counts against the field's own maxlength, so the two cannot
             disagree. -->
        <span class="description-count" data-testid="description-count"></span>
        <textarea
          maxlength="250"
          rows="2"
          data-testid="upload-description"
          placeholder="What is this photo?"
        ></textarea>
      </label>

      <div class="upload-actions">
        <button type="button" class="outline-button" data-testid="upload-submit">
          Upload
        </button>
      </div>
    </dialog>

    <dialog class="larger-view" data-testid="larger-view" aria-label="Photo">
      <header class="larger-view-bar">
        <button
          type="button"
          class="larger-view-close"
          data-testid="larger-view-close"
          aria-label="Close"
        >
          &times;
        </button>
      </header>
      <img class="larger-view-photo" data-testid="larger-view-photo" alt="" />

      <!-- REQ-GAL-002@v2 c9: the client answered "In the Larger view after I
           click the photo" when asked where a description is changed. -->
      <label class="larger-view-description-label">
        <span>Description</span>
        <span
          class="description-count"
          data-testid="larger-view-description-count"
        ></span>
        <textarea
          maxlength="250"
          rows="2"
          data-testid="larger-view-description"
        ></textarea>
      </label>

      <div class="larger-view-actions">
        <button type="button" class="outline-button" data-testid="description-save">
          Save description
        </button>
        <!-- REQ-GAL-006: an anchor to the download route is all a download
             needs. Its href is set when the Larger view opens a Photo. -->
        <a class="outline-button" data-testid="download-photo" href="" download>Download</a>
        <button type="button" class="danger" data-testid="delete-photo">Delete</button>
      </div>
    </dialog>

    <!-- REQ-GAL-005 criterion 4: the client gave this wording verbatim. It is
         a criterion, not a caption — do not reword it. -->
    <dialog class="confirm" data-testid="delete-confirmation">
      <p class="confirm-question" data-testid="delete-confirmation-question">
        Are you sure you want to delete this photo?
      </p>
      <div class="confirm-actions">
        <button type="button" data-testid="delete-decline">Keep it</button>
        <button type="button" class="danger" data-testid="delete-confirm">Delete</button>
      </div>
    </dialog>

    <!-- External, not inline: slice 1 set default-src 'self', which forbids
         an inline script. An inline handler would silently not run. -->
    <script src="{{ url_for('static', filename='app.js') }}"></script>
  </body>
</html>
