[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mygallery"
version = "0.1.0"
description = "A private photo gallery that runs on one PC"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.0,<4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=5.0,<7.0",
    "ruff>=0.6,<1.0",
    "playwright>=1.47,<2.0",
    "pytest-playwright>=0.5,<1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mygallery = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    # Belt C. Declared from slice 1 so `pytest -m integration` is a configured
    # command before the first belt-C test exists — see
    # .brain/constraints/g7-blocks-once-a-belt-c-requirement-is-agreed.md
    "integration: HTTP/API belt C tests",
]

[tool.coverage.run]
source = ["mygallery"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
# assert is the point of a test file
"tests/**" = ["S101"]
