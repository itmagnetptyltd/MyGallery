# Delivery slices.
#
# Requirement ids are the client's order — the order their brief happened to
# mention things. Slice order is ours: which increments can actually be
# demonstrated, and in what order. The two are unrelated, and the first slice
# is rarely REQ-<MODULE>-001.
#
# `depends_on` gives a topological ordering, but topology alone groups the
# runtime, the home page and the upload button into one level nobody can run.
# The grouping is a judgement, so it is written here rather than derived.
#
# One slice is one branch, one /feature-plan, one /tdd, one /close-slice, one pull request.
# /dashboard reads this file and shows each slice as Blocked, Not started,
# In progress or Done, plus a Next column for the command to type.
# A later slice cannot start until this one is Done.
#
# Delete these comments and list your slices:
#
# - id: 1
#   name: Boot
#   branch: feat/boot
#   why: The app starts with one command and serves the home page
#   covers: [REQ-EXAMPLE-013, REQ-EXAMPLE-014]
#
# - id: 2
#   name: Grid
#   branch: feat/grid
#   why: The home page renders stored items — order, pagination, empty state
#   covers: [REQ-EXAMPLE-001]

- id: 1
  name: Boot
  branch: feat/gal-boot
  why: "One command on Windows 11 starts MyGallery and a browser on that PC reaches it, while another device on the network cannot"
  covers: [REQ-GAL-011]

- id: 2
  name: Upload and Gallery
  branch: feat/gal-upload-gallery
  why: "An empty Gallery says so, a batch of photos uploads, non-images are refused, and the accepted ones appear as thumbnails newest first"
  covers: [REQ-GAL-001, REQ-GAL-002, REQ-GAL-003, REQ-GAL-007, REQ-GAL-010]

- id: 3
  name: Larger view
  branch: feat/gal-larger-view
  why: "Clicking a thumbnail opens the photo over the Gallery, Escape or the close control returns to the same scroll position"
  covers: [REQ-GAL-004]

- id: 4
  name: Delete and durability
  branch: feat/gal-delete
  why: "Deleting asks first, declining keeps the photo, confirming removes it and its thumbnail for good, and everything undeleted survives a restart"
  covers: [REQ-GAL-005, REQ-GAL-008]

- id: 5
  name: Download
  branch: feat/gal-download
  why: "Downloading a photo returns the exact file that was uploaded, byte for byte, under its original filename"
  covers: [REQ-GAL-006]

- id: 6
  name: Upload failure reporting
  branch: feat/gal-upload-failures
  why: "A batch of thirty with three bad files keeps the twenty-seven, names each failure with a plain-words reason, and leaves no partial file behind"
  covers: [REQ-GAL-009]

- id: 7
  name: UAT visual
  branch: feat/gal-uat-visual
  why: "Home Thumbnail cards are larger and designed as cards, Upload starts from a popup, and Larger view close and Delete sit inside the panel"
  covers: [REQ-GAL-012, REQ-GAL-013, REQ-GAL-014]

- id: 8
  name: Upload popup close and drop
  branch: feat/gal-upload-popup-controls
  why: "The Upload popup closes from a cross without uploading anything, and files can be dropped onto it instead of picked"
  covers: [REQ-GAL-016, REQ-GAL-019]

- id: 9
  name: Upload previews and Photo description
  branch: feat/gal-preview-and-description
  why: "Every chosen file is previewed before Upload, a description with a live counter is given alongside it, that description is the Thumbnail alt text, and it can be changed in the Larger view"
  covers: [REQ-GAL-015, REQ-GAL-017, REQ-GAL-018]
